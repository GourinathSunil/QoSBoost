rules:
- id: rule-voip-sip
  class_name: voice
  protocol: udp
  dst_ports:
  - 5060
  - 5061
  dscp_match: null
  description: SIP Signaling
- id: rule-voip-rtp
  class_name: voice
  protocol: udp
  port_ranges:
  - - 10000
    - 20000
  dscp_match: 46
  description: RTP Voice Streams
- id: rule-voip-port-direct
  class_name: voice
  protocol: udp
  dst_ports:
  - 5004
  - 5005
  dscp_match: null
  description: Direct VoIP stream port
- id: rule-video-webrtc
  class_name: video
  protocol: udp
  port_ranges:
  - - 50000
    - 50100
  dscp_match: 34
  description: WebRTC Video Streams
- id: rule-video-stream
  class_name: video
  protocol: udp
  dst_ports:
  - 554
  - 1935
  - 8554
  - 5002
  dscp_match: null
  description: Video streaming protocol ports
- id: rule-web-traffic
  class_name: web
  protocol: tcp
  dst_ports:
  - 80
  - 443
  - 8080
  - 8443
  dscp_match: null
  description: HTTP and HTTPS web traffic
- id: rule-bulk-iperf
  class_name: bulk
  protocol: tcp
  dst_ports:
  - 5201
  - 5202
  - 5203
  - 5204
  dscp_match: null
  description: Bulk data transfers and benchmarking
- id: rule-bulk-ftp
  class_name: bulk
  protocol: tcp
  dst_ports:
  - 20
  - 21
  dscp_match: null
  description: FTP bulk transfers
dynamic_allocation:
  high_watermark_utilization: 0.8
  low_watermark_utilization: 0.6
  step_down_bulk_percent: 0.25
  step_up_realtime_percent: 0.2
  min_bulk_floor_kbps: 150
  cooldown_seconds: 4.0
meters:
  flooder_meter:
    id: 1
    rate_kbps: 1000
    burst_size_kbps: 200
    action: drop
  bulk_meter:
    id: 2
    rate_kbps: 6000
    burst_size_kbps: 1000
    action: dscp_remark
    remark_dscp: 8
admission_control:
  enabled: true
  bottleneck_capacity_kbps: 10000
  safety_margin_percent: 0.1
  voice_flow_requirement_kbps: 100
  video_flow_requirement_kbps: 3000
